    <script>
      /* Language and theme before the first paint: a saved choice, ?lang=ar in the link, then the device. */
      (function () {
        var d = document.documentElement, l, t;
        try { l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang"); t = localStorage.getItem("theme"); } catch (e) {}
        if (l !== "ar" && l !== "en") l = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
        if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.lang = l; d.dir = l === "ar" ? "rtl" : "ltr"; d.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
